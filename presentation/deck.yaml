- layout: content_image
  title: 'Agentisch ist nicht das Terminal, sondern die Autonomie'
  bullets:
  - 'Auch eine GUI kann agentisch sein'
  - 'Autonomie heißt: delegierte Befugnisse'
  - 'CI automatisiert, sie entscheidet nicht selbst'
  image:
    path: deck_diagrams/dia_spectrum.png
    purpose: 'Zeigt vier Stufen delegierter Befugnisse: Vorschlagen, einzeln freigegeben handeln, im Rahmen selbst handeln und ohne Einzelfreigabe handeln. Die Oberfläche bestimmt diese Befugnisse nicht.'
  speaker: 'Tobias'
  notes: |
    ~2 min. Brücke zur Begriffe-Folie: Agent heißt, das Modell bestimmt die nächsten
    Schritte. Wie auf der Skill-Folie: Agentisch ist die Entscheidung, nicht der Skill.
    GUI-Punkt aufgreifen: Auch die OpenCode-GUI ist agentisch. Kriterium ist die Autonomie,
    nicht die Oberfläche.
    Die Stufen beschreiben Freigaben und Befugnisse, keine Rangfolge von Produkten.
    Eine feste CI-Pipeline kann vollständig deterministisch sein. Unser Ziel ist ein klar
    begrenzter Auftrag mit überprüften Ergebnissen, nicht möglichst viel Autonomie.

- layout: content
  title: 'Der Agent arbeitet, die Verantwortung bleibt bei Ihnen'
  bg_effect:
    prompt: 'a large wooden ship steering wheel with turned spokes mounted on its stand'
    path: deck_images/img_232ec118ebef.png
    seed: 32
  bullets:
  - 'Sie verstehen, was der Agent getan hat'
  - 'Sie geben frei, der Agent schlägt nur vor'
  - 'Geht etwas schief, stehen Sie dafür ein'
  - 'Ungeprüft nur, wo ein Fehler nichts kostet'
  sources:
  - 'Ewerlöf, Coding is NOT Solved, 26.09.2026': https://blog.alexewerlof.com/p/coding-is-not-solved
  speaker: 'Tobias'
  notes: |
    ~2 min. Human in the Loop. Die Autonomie wächst von Stufe zu Stufe, die Verantwortung wandert
    nicht mit. Kernsatz nach Ewerlöf: Verantworten kann nur, wer versteht.
    Die ersten drei Punkte sind Ewerlöfs drei Säulen: Wissen (was ist passiert, und warum),
    Mandat (wer darf entscheiden) und Verantwortung (wer steht gerade, wenn es schiefgeht). Das
    Modell hat keine davon.
    Wo wir das heute schon eingebaut haben: Plan-Mode, nichts wird geändert, bis Sie zustimmen.
    Tests und CI, die entscheiden, statt dem Eindruck zu glauben. Das Archiv, das festhält,
    warum so entschieden wurde.
    Faustregel für den Prüfaufwand: Wenig Kontrolle ist in Ordnung, wo ein Fehler nichts kostet,
    etwa beim eigenen Skript oder beim Machbarkeitstest. Eine Auswertung, die in eine
    Publikation geht, gehört nicht dazu.
    Warnung aus dem Artikel: Wer die Ausgabe nicht liest, vertraut ihr am meisten. Einen Finger
    zu viel auf einem Bild sieht jeder, einen Logikfehler in einer Auswertung nicht. Deshalb die
    Prüfung, nicht der Blick.

- layout: comparison
  title: 'Zwei offene Harnesses, der Einsatz entscheidet'
  bg_effect:
    prompt: 'a folded pocket knife with several tools fanned out beside a single plain screwdriver, both lying on a wooden workbench'
    seed: 2030
    path: deck_images/img_54f62c489aa1.png
  columns:
  - heading: 'OpenCode, der Allrounder'
    bullets:
    - 'Agent im Terminal, Modell je Agent'
    - 'LSP, Plugins, Skills, MCP'
    - 'oh-my-opencode: Routing, AST-Grep, Background-Agents'
    - 'Für tägliche Coding-Agents'
  - heading: 'pi, der Minimalist'
    bullets:
    - 'Skills, Prompt-Templates, Packages'
    - '„Adapt pi, nicht umgekehrt“'
    - 'Für schlanke Setups mit voller Kontrolle'
  sources:
  - text: 'Eigene Erfassung'
    footnote: true
  speaker: 'Tobias · Christian'
  notes: |
    ~4 min, inkl. Live-Demo: derselbe Prompt in beiden, Ergebnis-Differenz zeigen.
    Die Demo illustriert, wie Harnesses Kontext und Werkzeuge bereitstellen. Ein einzelner
    Lauf beweist keinen Leistungsunterschied: Auch Wiederholungen im selben Harness können
    anders ausfallen. Ein belastbarer Vergleich braucht gleiche Bedingungen und mehrere Läufe.
    Ergänzend: SAIA-Plugins bringen die GWDG-Chat-AI-Modelle nach pi, OpenCode und zot
    (Auto-Registrierung). Lokales Serving (Ollama, vLLM, llama.cpp) als Souveränitäts-Option.
    Merksatz: Das Modell ist das Gehirn, das Harness gibt ihm Hände.
    Ein Agent ruft gern andere Agenten auf: oh-my-opencode verteilt Teilaufgaben an benannte
    Background-Agents, jeder mit eigenem Modell. Dasselbe Prinzip bringt pi mit pi-subagents.
    Glossar: LSP = Language Server, MCP = Model Context Protocol, AST-Grep = strukturelle
    Code-Suche.

    Danach CHRISTIAN (~2 min), kommerzielle Gegenprobe: Claude Code, Codex, Antigravity CLI.
    (1) Die Stärke ist echt: installieren und loslegen, für viele Aufgaben reicht es dauerhaft.
    (2) Für unsere Auswahl zählen Modellanbindung, Erweiterbarkeit, Freigaben und Kosten pro
        erfolgreich erledigter Aufgabe. Aussagen über Rangplätze oder Tokenverbrauch brauchen
        vergleichbare Aufgaben, Einstellungen und mehrere Läufe; hier zeigen wir Praxiserfahrung.
    (3) Das Muster: drei Anbieter, drei Harnesses, jedes auf die eigenen Modelle abgestimmt.
        Gemini CLI wurde im Juni 2026 auf Antigravity CLI umgestellt.
    (4) Schluss: Bequemlichkeit gegen Kontrolle. Beides ist legitim.

