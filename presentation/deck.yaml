- layout: table
  title: 'Bei diesen fünf Begriffen legen wir uns für heute fest'
  bg_effect:
    prompt: 'a brass magnifying glass with a wooden handle lying on a smooth pebble'
    path: deck_images/img_cc43938846cd.png
    seed: 14
  headers: ['Begriff', 'Worüber gestritten wird', 'Unsere Festlegung']
  rows:
  - ['Agent', 'von Chatbot bis autonomes System', 'Das Modell bestimmt die nächsten Schritte']
  - ['Reasoning', 'ob das Denken ist', 'mehr Rechenzeit zur Laufzeit']
  - ['Halluzination', 'Begriff umstritten, eher Konfabulation', 'unbelegte Ausgabe, Grund für die Tests']
  - ['Open Weights', 'Gewichte offen, Rest oft nicht', 'Lizenzen getrennt prüfen']
  - ['Reproduzierbarkeit', 'gleiche Eingabe, anderes Ergebnis', 'Stand sichern, Analyse wiederholen']
  speaker: 'Christian'
  notes: |
    Nicht alle fünf Zeilen gleich lang behandeln, die letzten beiden tragen das
    Publikum. Rahmensatz: Bei diesen Begriffen ist sich die Fachwelt nicht einig. Wir legen uns
    für heute fest. Das ist eine Setzung, kein Stand der Forschung.

    Warum diese Folie in jedem unserer Vorträge steht:
    - Jeder dieser Begriffe ist umstritten, und ohne Festlegung beginnt die erste Fragerunde
      mit einer Grundsatzdebatte über Definitionen.
    - Eine offen benannte Setzung nimmt dem Einwand die Spitze: Wir beanspruchen nicht die
      richtige Definition, wir sagen nur, wie wir die Wörter heute verwenden.
    - Danach geht es um die Sache, nicht mehr um das Vokabular.

    (1) Agent: Trennlinie ist, wer den Ablauf bestimmt. Bestimmt das Modell die nächsten
        Schritte, ist es ein Agent. Eine feste Abfolge ist ein Workflow, auch wenn ein Modell
        darin vorkommt.
    (2) Reasoning: nüchtern halten, mehr Rechenzeit zur Laufzeit, mehr Zwischenschritte. In
        manchen Werkzeugen heißt dasselbe "Thinking". Ob das Denken ist, kostet nur
        Diskussionszeit.
    (3) Halluzination: nicht beschwichtigen. Ein Modell, das das nächste Token vorhersagt, kann
        belegt und plausibel nicht unterscheiden. Daraus folgt: maschinell verifizieren statt
        vertrauen. Für die Literaturrecherche konkret: "Steht nicht im Dokument" ist eine
        richtige Antwort, keine fehlende. Wo sie nicht erlaubt ist, füllt das Modell die Lücke
        mit einem plausiblen Wert.
    (4) Open Weights: Zugängliche Modellgewichte allein machen ein Modell noch nicht zu
        Open-Source-KI. Lizenz, Trainingsinformationen und Nutzungsbedingungen getrennt prüfen.
        Bei OpenCode und pi sprechen wir dagegen über Open-Source-Software.
    (5) Reproduzierbarkeit: Ein Agentenlauf kann trotz gleicher Eingabe anders verlaufen.
        Deshalb Datenstand, Code, Umgebung, Modellversion, Einstellungen und relevante
        Anweisungen dokumentieren. Den erzeugten Analysecode mit gesicherten Eingaben erneut
        ausführen; verbleibende Schwankungen benennen. Tests prüfen definierte Eigenschaften,
        stellen aber weder Reproduzierbarkeit noch wissenschaftliche Gültigkeit allein her.

    Wenn die Zeit knapp wird: (2) und (4) auf je einen Satz. (5) niemals kürzen.

- layout: content_image
  title: 'Ein agentisches System besteht aus vier Bausteinen'
  bullets:
  - 'Modellwissen ist keine Datenbank'
  - 'Kontext ist Arbeitsgedächtnis'
  - 'Werkzeuge nur, soweit freigegeben'
  - 'Das Harness setzt Grenzen'
  image:
    path: deck_diagrams/dia_blocks.png
    purpose: 'Zeigt die Schleife im Harness: Der Kontext geht an das Modell, das Modell wählt den Schritt, ein Werkzeug führt ihn aus, und das Ergebnis fließt zurück in den Kontext.'
  speaker: 'Christian'
  notes: |
    Darüber, wie man einen Agenten beauftragt, lässt sich nicht sprechen, solange
    offen ist, wer hier eigentlich handelt. Der Raum ist gemischt, beide Hälften meinen mit "KI"
    etwas anderes. Wir zerlegen den Begriff einmal.

    Modell: erzeugt die nächsten Tokens und nutzt dabei gelerntes Wissen. Dieses Wissen ist
    keine verlässlich abfragbare Fakten-Datenbank; aktuelle und projektspezifische Belege
    gehören in den Kontext.
    Kontext: aktuell bereitgestellte Dateien, Spezifikation, Verlauf und Werkzeugergebnisse.
    Arbeitsgedächtnis ist hier eine Metapher für begrenzten Arbeitskontext. Dauerhafte Regeln
    gehören in Dateien und müssen bei Bedarf wieder geladen werden (nächste Folie).
    Werkzeuge: erst hiermit handelt das System. Wer nichts freigibt, bekommt einen
    Gesprächspartner, keinen Agenten.
    Harness: Kontext zusammenstellen, Werkzeuge aufrufen, Ergebnisse zurückspeisen, Schleife
    beenden. Das Modell schlägt Schritte vor; das Harness entscheidet anhand seiner Regeln,
    was ausgeführt werden darf, eine Freigabe braucht oder abgebrochen wird.
    Diese Umgebung wird auch als "Scaffolding" bezeichnet.

    Alle vier zusammen sind das, was umgangssprachlich "KI" heißt.
    Übergabe an Tobias' Block: Dasselbe Modell, ein anderes Harness, ein anderes Ergebnis.

    Wenn die Zeit knapp wird: Werkzeuge auf zwei Sätze. Kontext und Harness nicht kürzen.

- layout: content_image
  title: 'Wer einen Agenten aufbaut, legt vier Dinge fest'
  bullets:
  - 'Instruktionen: AGENTS.md, verweisen auf Skills'
  - 'Skills: Anleitungen zum Nachschlagen'
  - 'Trigger: Befehl, Zeitplan oder Ereignis'
  - 'Capabilities legen fest, was er darf'
  image:
    path: deck_diagrams/dia_setup.png
    purpose: 'Zeigt, was einen Agenten ausmacht: Ein Trigger startet ihn, Instruktionen sind immer geladen, Skills wandern bei Bedarf in beide Richtungen, und über Capabilities ruft er Werkzeuge auf.'
  sources:
  - 'Model Context Protocol': https://modelcontextprotocol.io
  speaker: 'Christian'
  notes: |
    ~3 min. Die vorige Folie zeigt, woraus ein System besteht, diese, was man
    festlegt. Instruktionen und Skills landen im Kontext, Capabilities sind die Werkzeuge, der
    Trigger startet das Harness.

    Instruktionen: kurz, gelten immer. Sie verweisen auf die Skills, statt deren Wissen zu
    wiederholen. Eine echte AGENTS.md zeigt Tobias im ersten Hands-On.
    Skills: der Doppelpfeil. Das Modell fordert einen Skill an, sein Inhalt kommt zurück. Was
    ein Skill genau ist, zeigt die nächste Folie.
    Trigger: Heute in Übung 1 Ihr Prompt, in Übung 2 zusätzlich die CI per Zeitplan.
    Capabilities: die Werkzeuge von eben als Konfiguration, meist über das Model Context
    Protocol (MCP): welche Server, welche Rechte. MCP-Server können Code ausführen, also nur
    aus vertrauenswürdigen Quellen.

- layout: fullbleed
  title: 'Auch Agents as a Service brauchen genau diese vier Dinge'
  image:
    path: deck_images/screenshot_n8n_agent_builder.png
    purpose: 'Zeigt einen echten Agent-Builder mit den Feldern Model, Instructions, Skills, Triggers und Capabilities.'
  speaker: 'Christian'
  notes: |
    ~1 min. Beleg, dass die Einteilung der vorigen Folie kein Konstrukt von uns ist: Ein
    Agent-Builder als Dienst (Screenshot: n8n) fragt genau diese Felder ab. Model ist Pflicht,
    hier ein Qwen-Modell über eine OpenAI-kompatible Schnittstelle. Unter Triggers stehen Kanal
    und Zeitplan, unter Capabilities Tools, Workflows und Sub-Agents: Ein Agent ruft gern andere
    Agenten auf.

- layout: content
  title: 'Ein Skill ist eine Anleitung, die das Modell selbst nachschlägt'
  bg_effect:
    prompt: 'an adjustable desk lamp with a round metal shade shining down onto a pair of round reading glasses lying below it'
    seed: 17
    path: deck_images/img_452650e3774e.png
  bullets:
  - 'Ein Ordner mit SKILL.md: Name, Beschreibung, Anleitung'
  - 'Im Kontext steht anfangs nur die Beschreibung'
  - 'Das Modell entscheidet, wann es nachliest'
  - 'Offener Standard, läuft in OpenCode und pi'
  - 'Fremde Skills vorher lesen, sie können Code ausführen'
  sources:
  - 'Agent Skills Specification': https://agentskills.io/specification
  - 'OpenCode Skills': https://opencode.ai/docs/skills/
  - 'pi Skills': https://pi.dev/docs/latest/skills
  - 'Snyk ToxicSkills, 02/2026': https://snyk.io/blog/toxicskills-malicious-ai-agent-skills-clawhub/
  speaker: 'Christian'
  notes: |
    ~2 min. Ein Skill ist ein Ordner mit SKILL.md, darin Name, Beschreibung, Anleitung,
    optional Skripte. Im Kontext steht anfangs nur die Beschreibung, etwa 50 bis 100 Token; den
    Rest liest das Modell erst, wenn es ihn braucht. Offener Standard (agentskills.io), der Pfad
    .agents/skills/ funktioniert in OpenCode und pi.
    Beispiel für Forschende: citation-management (K-Dense-AI/scientific-agent-skills) prüft
    Zitate über OpenAlex und PubMed und erzeugt BibTeX.

    Die Frage aus dem letzten Kurs, "Was ist agentisch an OpenCode mit geladenem Skill?":
    Agentisch ist nicht der Skill, sondern die Entscheidung des Modells, ihn zu laden. Wer
    /skill:name tippt, ist selbst der Trigger und nimmt dem Modell diese Entscheidung ab.

    Vorsicht: Skills können Skripte enthalten. Snyk hat im Februar 2026 knapp 4.000 Skills
    geprüft, 13,4 Prozent mit kritischen Problemen. Nur aus vertrauenswürdigen Quellen, und
    vorher lesen.

- layout: table
  title: 'Wo wir Agenten heute schon begegnen'
  bg_effect:
    prompt: 'a small round smart speaker with a glowing ring of light standing on a side table'
    path: deck_images/img_fa40815db3c4.png
    seed: 17
  headers: ['Wo', 'Beispiel', 'Der Agent entscheidet selbst']
  rows:
