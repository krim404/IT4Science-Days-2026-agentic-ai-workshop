- layout: section
  number: '2'
  title: 'Wie man einen Agenten beauftragt'
  bg_effect:
    path: deck_images/img_688fddd86552.png
  speaker: 'Christian'
  notes: |
    Abschnittstrenner, etwa zwei Sätze. Ab hier geht es nicht mehr um Werkzeuge,
    sondern darum, wie man einem Agenten einen Auftrag gibt, den er erledigen kann. Die
    Struktur, die dabei entsteht, taucht heute noch dreimal auf: im Research-Repository, in
    OpenSpec und in der eigenen Übung.

- layout: content_image
  title: 'Fragen oder Beauftragen'
  bullets:
  - 'Fragen: „Fassen Sie diese Papers zusammen.“'
  - 'Beauftragen: „Extrahieren Sie diese fünf Felder aus jedem Paper.“'
  image:
    path: deck_diagrams/dia_brief.png
    purpose: 'Zeigt, dass nur das Beauftragen eine Prüfung mit Abbruchbedingung hat, die bei einem Fehlschlag zurück in die Umsetzung führt.'
  speaker: 'Christian'
  notes: |
    Der Einstieg: zwei Arten, einem Agenten etwas zu geben. Die beiden Bahnen
    nacheinander durchgehen, nicht gegeneinander.

    (1) Linke Bahn: "Fassen Sie diese Papers zusammen." Es kommt ein Text, er liest sich gut,
        Sie entscheiden nach Eindruck. Dann ist die Bahn zu Ende. Zusammenfassen ist dabei das
        schwerere Problem: Die Zusammenfassung entscheidet selbst, was wichtig ist, und niemand
        kann nachprüfen, was weggefallen ist.
    (2) Rechte Bahn: "Extrahieren Sie diese fünf Felder aus jedem Paper." Fünf benannte Felder
        kann man prüfen. Der Unterschied ist nicht die Formulierung, sondern das Kriterium.
    (3) Der Rückpfeil ist der Kern: Nur die rechte Bahn kann scheitern, und genau deshalb kann
        sie auch fertig werden. Merksatz: Wer nicht sagen kann, woran es scheitern würde, hat
        nicht beauftragt, sondern gehofft.
    (4) Bezug zum Raum: Die Literaturrecherche, die Sie sich am Anfang überlegt haben, ist genau dieser Fall.
    (5) Überleitung: Was muss ein solcher Auftrag enthalten, damit er prüfbar ist? Das zeigt die
        nächste Folie.

- layout: content_image
  title: 'Ein prüfbarer Auftrag hat drei Ebenen'
  bullets:
  - 'Jede Ebene ist eine Datei, kein Gespräch'
  - 'Der Vertrag ist eine Spezifikation für eine Änderung'
  - 'Der Vertrag nennt das Kriterium, der Test wendet es an'
  image:
    path: deck_diagrams/dia_levels.png
    purpose: 'Zeigt die drei Ebenen als Pyramide in der Reihenfolge ihrer Autorität und den Rückweg, auf dem eine beim Prüfen gefundene Lücke zu einem neuen Vertrag wird.'
  speaker: 'Christian'
  notes: |
    Die Pyramide ist der Auftrag von der vorigen Folie, zu Ende gedacht. Sie ist der
    rote Faden des Vormittags. Spezifikation oben als Quelle der Wahrheit, Vertrag in der Mitte
    als Auftrag an den Agenten, Tests unten als Prüfung definierter Kriterien. Wir kommen auf dieses
    Bild immer wieder zurück.
    Rückverweis auf den Chip: Genau diese drei Ebenen lagen dort vor.
    Der gestrichelte Pfeil ist der eigentliche Punkt: Die Spezifikation ist kein Dokument, das
    am Anfang geschrieben und dann abgelegt wird. Ein roter Test ändert den Code, nie die
    Spezifikation. Was beim Prüfen als Lücke sichtbar wird, wird ein neuer Vertrag, und erst mit
    ihm wächst die Spezifikation.
    In den Werkzeugen heißen die Ebenen englisch Spec, Contract und Test.

- layout: table
  title: 'Jede der drei Ebenen legt etwas anderes fest'
  bg_effect:
    prompt: 'three flat stones of decreasing size stacked into a small cairn'
    path: deck_images/img_9ba9c29a9502.png
    seed: 21
  headers: ['Ebene', 'Legt fest', 'Im Repository']
  rows:
  - ['Spezifikation', 'was gelten soll, prüfbar formuliert', 'specs/, AGENTS.md']
  - ['Vertrag', 'was sich jetzt ändert, und woran man es misst', 'ein Change mit Vorschlag und Aufgaben']
  - ['Tests', 'ob die geprüften Fälle bestehen', 'Testsuite, Validierung, CI']
  speaker: 'Christian'
  notes: |
    Diese Folie erklärt das Bild Ebene für Ebene.

    (1) Spezifikation: nicht "das Gerät soll sicher sein", sondern eine Anforderung, deren
        Erfüllung sich prüfen lässt. Für dieses Publikum: eine Hypothese, die so formuliert ist,
        dass ein Experiment sie widerlegen könnte. Kriterien vor der Arbeit: Wer sie hinterher
        formuliert, formuliert sie so, dass das Ergebnis passt. Genau deshalb gibt es
        Präregistrierung.
    (2) Vertrag: Der Agent bekommt nicht die gesamte Spezifikation, sondern die Differenz: Das
        ist der Stand, das soll sich ändern, daran wird es gemessen. Analogie: das
        Versuchsprotokoll für einen Durchlauf. Der Vertrag ist selbst eine Spezifikation, nur für
        eine Änderung. Er nennt das Kriterium, der Test wendet es an.
    (3) Tests: Bestanden oder nicht bestanden gilt für die tatsächlich geprüften Fälle.
        Grün bedeutet: Die definierten Prüfungen wurden bestanden. Ob diese Prüfungen
        fachlich ausreichen, verantworten wir. Dazu gehören unabhängige Referenzfälle,
        Negativfälle und Review. Reproduzierbarkeit verlangt zusätzlich gesicherte Daten,
        Code und Umgebung sowie eine wiederholbare Analyse.

    Glossar für Rückfragen: SHALL, MUST, SHOULD sind die üblichen Signalwörter. "Gegeben, wenn,
    dann" ist die Schablone für Szenarien: Ausgangslage, Eingriff, erwartetes Ergebnis.

- layout: statement
  title: 'Erledigt ist eine Aufgabe erst, wenn die Prüfung bestanden ist.'
  bg_effect:
    prompt: 'a traffic light on a slender pole with its green lamp lit'
    seed: 1007
    path: deck_images/img_28e81bff8250.png
  speaker: 'Christian'
  notes: |
    Stehen lassen und bewusst betonen. Dieser Satz kommt in Übung 2 zurück und ist
    dort das Bewertungskriterium. Eine bestandene Prüfung ist notwendig, aber allein keine
    Garantie für ein fachlich richtiges Ergebnis. Die Kriterien werden vorab festgelegt und
    ihre Abdeckung wird von Menschen beurteilt.

