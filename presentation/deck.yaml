  - ['Berichten', 'Überblick, Trends, Kurz-Briefings']
  speaker: 'Tobias'
  notes: |
    Etwa 15 Minuten im Agenten (OpenCode oder pi mit SAIA): Die Teilnehmenden geben ihr
    Recherche-Thema vom Anfang ohne Spec in den Plan-Mode. Der Agent plant selbst, das ist
    bereits agentisch. Erst den Plan lesen: Steht darin, woran man erkennt, dass er fertig ist?
    Dann bauen lassen. Was kommt dabei heraus?
    Kein Tool-Zwang: Wem das Harness nicht startet, arbeitet mit der Nachbarin oder dem
    Nachbarn. Timer sichtbar machen. Beim Herumgehen: Starthilfe beim Harness-Start.
