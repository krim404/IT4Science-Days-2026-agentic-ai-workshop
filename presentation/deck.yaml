- layout: table
  title: 'Übung 2 Schritt für Schritt, am Beispiel thema-x'
  bg_effect:
    prompt: 'a sturdy wooden stepladder standing upright on a workshop floor'
    path: deck_images/img_ee03cf773344.png
    seed: 51
  headers: ['Schritt', 'Eingabe', 'Ergebnis']
  rows:
