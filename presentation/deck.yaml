  - ['2 · Agent', '/opsx-propose thema-x: Papers pro Jahr als Kennzahl', 'Proposal, Tasks und Spec']
  - ['3 · Terminal', 'openspec status --change thema-x', 'welche Teile schon stehen']
  - ['4 · Terminal', 'openspec validate thema-x --strict', 'Strukturprüfung der Spec']
  - ['5 · Agent', '/opsx-apply thema-x', 'der Agent arbeitet die Tasks ab']
  - ['6 · Terminal', 'openspec list', 'Fortschritt, etwa 4/4 tasks']
  - ['7 · Agent', '/opsx-archive thema-x', 'die Spec wird fortgeschrieben']
  sources:
  - 'OpenSpec 1.13.2, CLI-Referenz': https://github.com/Fission-AI/OpenSpec/blob/main/docs/cli.md
  speaker: 'Christian'
  notes: |
    Zum Zeigen für alle, die hängen bleiben. Geprüft mit OpenSpec 1.13.2. Vor dem Workshop
    kurz npm view @fission-ai/openspec version prüfen, es erscheint etwa wöchentlich eine neue.
    (1) Einmal pro Repo. Legt openspec/config.yaml an und die Befehle für OpenCode und pi. Mit
        --language Deutsch schreibt der Agent die Dateien auf Deutsch, aber nur bei einer neuen
        config.yaml. Hat das Repo schon ein openspec/, kommen nur die Agenten-Befehle dazu.
    (2) In OpenCode und pi mit Bindestrich: /opsx-propose. In Claude Code heißt es /opsx:propose.
        Der Agent legt openspec/changes/thema-x/ an: proposal.md, tasks.md und eine Delta-Spec
        unter specs/<name>/spec.md. Jetzt selbst lesen und schärfen, das ist der eigentliche Teil
        der Übung: Woran würden Sie merken, dass es falsch ist?
    (3) Zeigt, welche Teile fertig sind. design.md ist optional; status meldet die Tasks trotzdem
        als "blocked by design", solange sie fehlt. Das stört validate und archive nicht.
    (4) Die Strukturprüfung der Spec, kein Test der Implementierung. Häufigster Fehler:
        "muss" statt SHALL oder MUST. Die Schlüsselwörter bleiben
        englisch, der Rest darf deutsch sein. Jedes Requirement braucht ein Scenario mit WHEN und
        THEN.
    (5) Der Agent setzt die Tasks um und hakt sie ab.
    (6) Kontrolle: Alle Tasks erledigt? Häkchen belegen keinen bestandenen Test. Vor dem
        Archivieren die Implementierung gegen bekannte Eingaben und erwartete Ergebnisse
        testen, einen Negativfall prüfen und das Ergebnis fachlich reviewen.
    (7) Der Change wandert nach openspec/changes/archive/<Datum>-thema-x/, die Spec nach
        openspec/specs/. Im Terminal geht dasselbe mit openspec archive thema-x --yes.
    Ohne Agent: openspec new change thema-x legt nur den leeren Ordner an, die drei Dateien
    schreibt man dann selbst.

- layout: table
