    Durchgehendes Beispiel: Papers pro Jahr zählen. Die Spec legt fest, wie fehlende Daten
    behandelt werden; der Change beauftragt die Auswertung; ein Test prüft bekannte Fallzahlen.
    (1) Spezifikation: gilt dauerhaft, wird nicht pro Sitzung neu verhandelt.
    (2) Vertrag: nur die Differenz. Nicht "baue mir ein Analysewerkzeug", sondern "ergänze diese
        eine Auswertung, gemessen an diesem Kriterium".
    (3) Tests: prüfen die vereinbarten Fälle mit bekannten Eingaben und erwarteten Ergebnissen.
