    die Datei, dann die Prüfung.
    Given/When/Then für die erste Spec. Delta-Specs für den ersten Change. Zu Instruktionen und
    Skills: pi-memory oder ein Knowledge Graph statt Prompt-Stücken. Der Loop wird
    institutionalisiert: Die Spezifikation wächst mit dem Betrieb.

