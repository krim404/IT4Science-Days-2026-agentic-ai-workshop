- layout: content
  title: 'Sechs Entwicklungen prägen die Modelle im Jahr 2026'
  bullets:
  - 'Reasoning ist reif: planen statt vervollständigen'
  - 'Kontext wächst von 200.000 auf über eine Million Token'
  - 'MCP wird der Standard für Werkzeugzugriff'
  - 'Werkzeugaufrufe sind produktionsreif'
  - 'Offene Gewichte holen auf, die Kosten fallen'
  - 'Lokal und souverän betreiben ist eine echte Option'
  bg_effect:
    path: deck_images/img_ca26c716ea80.png
  speaker: 'Christian · Tobias'
  notes: |
    Je Punkt etwa eine Minute.
    (1) Rechenzeit skalieren statt Parameter: o-Serie, DeepSeek-R1, Claude-Thinking. Planen,
        verifizieren, korrigieren.
    (2) 200K bis über 1M Token (Gemini 3.1 Pro): ganze Codebases und Specs im Kontext.
    (3) MCP, die Capabilities von der Aufbau-Folie: Ein Standard entkoppelt Modell und Werkzeug.
    (4) Strukturierte Ausgaben, parallele Werkzeugaufrufe, Multi-Agent.
    (5) Qwen 3.5/3.6 (MoE bis 397B), Qwen3.8 27B, GLM 4.7/5.3, Devstral 2, DeepSeek V4, GPT-OSS
        120B, Gemma 4 31B. Kleine Modelle sind heute eher die 30B-Klasse. Für viele Aufgaben
        reicht ein kleines Modell.
    (6) Ollama, vLLM, llama.cpp auf eigener Hardware. Sensible Forschungsdaten gehen an lokale
        Modelle; der GWDG/SAIA-Zugang existiert institutsseitig.

    TOBIAS nach (5) und (6), 2 min Praxis-Sicht: der SAIA-Katalog (09/2026), GLM 4.7, GLM 5.3
    Flash, Qwen 3.5, Qwen 3.6 35B, Qwen3.8 27B, Qwen3-Coder-Next, Devstral 2, DeepSeek V4 Flash,
    GPT-OSS 120B, Gemma 4 31B.

    Schlusssatz: Knapp ist nicht mehr die Fähigkeit der Modelle, knapp ist eine klare Anweisung.

- layout: table
  title: 'Unsere Modellwahl im Alltag'
  bg_effect:
    prompt: 'an old brass balance with two pans hanging from a beam, a small stone resting in one pan'
    path: deck_images/img_8560786febfc.png
    seed: 25
  headers: ['Aufgabe', 'Unsere Wahl', 'Einordnung']
  rows:
  - ['Freie Texte, Übersetzung', 'GPT-6', 'bewährt in unseren Schreibaufgaben']
  - ['Vision', 'GPT-6, Claude Fable 5', 'Fable 5 führt die Arena Vision']
  - ['Code, größere Umbauten', 'Claude Opus 5.5, zunehmend GLM', 'bei uns oft wenige Korrekturen']
  - ['Code gezielt umschreiben', 'Qwen3.8-Flash-Next, GLM', 'offene Gewichte, schnell, günstig']
  - ['Abläufe mit Werkzeugen', 'GLM 5.3 Flash, Claude Sonnet 5.5', 'verlässliche Werkzeugaufrufe']
  - ['Sensible Forschungsdaten', 'Qwen3.8 27B, lokal via vLLM', 'die Daten verlassen das Haus nicht']
  - ['Viele gleichartige Fälle', 'DeepSeek V4.1 Flash', 'Geschwindigkeit und Kosten entscheiden']
  sources:
  - text: 'Eigene Erfassung, Stand 09/2026'
    footnote: true
  - text: 'Arena Vision Leaderboard, Stand 28.09.2026'
    url: 'https://arena.ai/leaderboard/vision'
  speaker: 'Christian'
  notes: |
    Beantwortet die Frage, die im Raum tatsächlich gestellt wird: Welches Modell
    soll ich nehmen? Keine Rangliste, sondern ein Kriterium, das auch nächstes Jahr trägt: nach
    Aufgabe wählen, nicht nach Ruf des Anbieters.

    Die oberen Zeilen sind für viele im Raum die relevantesten, weil sie täglich schreiben.
    Vision: GPT-6 überzeugt in eigenen Tests, auf der Arena-Vision-Rangliste führt Claude Fable 5.
    Code: Claude ist bei größeren Umbauten oft auf Anhieb erfolgreich und entsprechend teuer.
    Qwen3.8-Flash-Next leistet für gezielte Umschreibungen mehr als frühere Coder-Modelle, bei
    offenen Gewichten. GLM steht zweimal, weil es am schnellsten aufholt.
    Unten: Sensible Daten sind oft vorab entschieden. Häufigster Denkfehler: für jede Aufgabe das
    größte Modell.

    Schlusssatz: Die offenen Modelle holen massiv auf. In vielen Aufgaben ist der Abstand
    kleiner als der Preisunterschied. Deshalb die Steuerungsebene austauschbar halten.

    Quelle: eigener laufender Einsatz, nicht Benchmarks. Benchmarking ist methodisch schwierig:
    Testdaten geraten in Trainingsdaten, Ergebnisse hängen am Aufgabenzuschnitt, und zwischen
    Veröffentlichung und Vortrag liegen oft mehrere Modellgenerationen.

- layout: content_image
  title: 'Das Harness bestimmt, was das Modell erreichen kann'
  bullets:
  - 'Modell und Kontext prägen die Antwort'
  - 'Das Harness begrenzt die Ausführung'
  - 'Das Modell schlägt nächste Schritte vor'
  - 'Gutes Harness kann Modellschwächen ausgleichen'
  image:
    prompt: 'an apple tree whose red apples hang only high up in its crown, on the left a large robot stands on the grass stretching both arms up, its hands far below the lowest apple, on the right a small robot stands on top of a tall wooden stepladder and picks an apple from the top of the crown, both robots with plain smooth bodies'
    seed: 1007
    purpose: 'Zeigt, dass die Ausrüstung und nicht die Größe entscheidet, was erreichbar ist: Der kleine Roboter auf der Leiter pflückt den Apfel, an den der große nicht herankommt.'
    path: deck_images/img_5c1ab66c78ca.png
  sources:
  - text: 'Eigene Beobachtung, kein kontrollierter Vergleich'
    footnote: true
  speaker: 'Christian'
  notes: |
    Angelpunkt des Vormittags und Übergabe an Tobias.

    (1) Modell, Anweisung und verfügbarer Kontext beeinflussen schon eine einzelne Antwort.
        Bei mehreren Schritten kommen Werkzeugauswahl, Rückmeldungen und Abbruchregeln hinzu.
    (2) Das Modell schlägt Schritte vor. Das Harness steuert Kontext, Ausführung, Rechte und
        Abbruchbedingungen. Mit seiner Konfiguration legen Sie fest, welche Schritte möglich
        sind und welche Freigaben sie brauchen.
    (3) Eigene Praxiserfahrung, kein allgemeiner Leistungsvergleich: Ein passendes Harness
        kann Schwächen eines Modells ausgleichen. Das gilt nicht für jede Aufgabe.
    (4) Warum: Das Modell sieht nur, was die Umgebung zeigt, darf nur, was sie erlaubt, und läuft
        nur so lange, wie sie es laufen lässt.
    (5) Entlastung: Niemand muss das teuerste Abonnement abschließen. Wer seine Aufträge prüfbar
        macht, kommt mit günstigen oder lokalen Modellen weit.

    Merksatz: Auch das beste Modell ist nur so gut wie sein Harness.
    Übergabe: Was das konkret bedeutet, zeigt Tobias jetzt am lebenden Objekt.

