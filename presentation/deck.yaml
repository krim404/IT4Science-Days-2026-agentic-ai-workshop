  - ['Büro', 'Copilot Researcher in M365', 'was er in Mails und Dateien sucht']
  - ['Browser', 'Claude in Chrome, Comet', 'wohin er klickt, was er einträgt']
  - ['Zuhause', 'Alexa+', 'welchen Dienst er für eine Buchung nutzt']
  - ['Forschung', 'Elicit, Google Co-Scientist', 'wie er eine Forschungsfrage zerlegt']
  - ['Software', 'Claude Code, Codex, Copilot', 'welche Datei er ändert, was er testet']
  sources:
  - 'Gemini Deep Research': https://gemini.google/de/overview/deep-research/
  - 'Microsoft 365 Copilot Researcher': https://learn.microsoft.com/en-us/copilot/microsoft-365/faq-researcher
  - 'Claude in Chrome': https://claude.com/blog/claude-in-chrome-generally-available
  - 'Alexa+ in Deutschland': https://www.teltarif.de/en/alexaplus-deutschland-amazon/news/103392.html
  - 'Elicit Research Agent': https://elicit.com/blog/introducing-research-agent-workflows
  - 'Google Co-Scientist': https://deepmind.google/blog/co-scientist-a-multi-agent-ai-partner-to-accelerate-research/
  speaker: 'Christian'
  notes: |
    ~2 min. Die Definition von der Begriffe-Folie an Bekanntem festmachen. Die rechte Spalte ist
    jeweils der Teil, der es zum Agenten macht: Das Modell wählt den nächsten Schritt.

    Einstieg per Handzeichen: Wer hat schon eines davon genutzt? Greift die zweite Frage der
    Handzeichen-Runde auf.

    Abgrenzung: Nicht alles, was "Agent" heißt, ist einer. Viele Hotline-Bots, auch Telekom
    Voice AI Notes, sind feste Abläufe, also Workflows. Gartner nennt das "Agent Washing": Von
    Tausenden Anbietern gelten nur rund 130 als echt agentisch.
    Randnotiz: Die Handy-Agenten (Gemini Intelligence, Siri AI auf dem iPhone) sind in der EU
    derzeit gesperrt.
    Die meisten denken bei "Agent" an einen Assistenten, der in Mail, Browser oder Shop etwas
    erledigt. Unsere Definition deckt das ab, sie ist nur allgemeiner.

    Überleitung: Heute arbeiten wir mit der letzten Zeile. Nicht, weil sie die wichtigste ist,
    sondern weil dort jeder Schritt sichtbar ist und sich prüfen lässt.

