- layout: table
  title: 'Spec-Kit baut Neues, OpenSpec ändert Bestehendes'
  bg_effect:
    prompt: 'a mason trowel resting on top of a half built brick wall'
    path: deck_images/img_b4fa4bf188c4.png
    seed: 39
  headers: ['', 'Spec-Kit', 'OpenSpec']
  rows:
  - ['Grundidee', 'was gebaut werden soll', 'wie sich Bestehendes ändert']
  - ['Typischer Fall', 'Neubau, neue Funktionen', 'laufende Weiterentwicklung']
  - ['Quelle der Wahrheit', 'eine Spezifikation je Vorhaben', 'dauerhafte Spezifikation plus Änderungen']
  - ['Ablauf', 'specify, clarify, plan, tasks', 'propose, apply, sync, archive']
  - ['Aufwand', 'höher, mehr Prozessführung', 'niedriger']
  sources:
  - 'GitHub Spec Kit': https://github.com/github/spec-kit
  - 'Fission AI OpenSpec': https://github.com/Fission-AI/OpenSpec
  speaker: 'Christian'
  notes: |
    Die Konsequenz zu Ende gedacht: Wer Aufträge dauerhaft als Dateien führt,
    braucht ein Werkzeug dafür. Zwei verbreitete Ansätze, und warum wir heute OpenSpec nehmen.
    Kurz halten, es geht um die Denkweise.
    (1) Spec-Kit denkt in Vorhaben, OpenSpec in Änderungen.
    (2) Spec-Kit: pro Funktion ein Satz Dokumente. Nach fünfzig Vorhaben liegen fünfzig
        Momentaufnahmen vor, und welche den heutigen Stand beschreibt, ist schwer zu sagen.
    (3) OpenSpec: eine dauerhafte Spezifikation, daneben Änderungen als ADDED, MODIFIED oder
        REMOVED. Nach dem Abschluss wandert die Änderung in die Hauptspezifikation.
    (4) Analogie: das Studienprotokoll je Teilstudie gegen das fortgeschriebene Handbuch mit
        Änderungsnachweis.
    Faustregel: Neues Vorhaben Spec-Kit, bestehendes System, das wächst, OpenSpec. Heute
    bearbeiten wir ein bestehendes Repository, deshalb OpenSpec. Das ist der Grund, kein
    Werturteil.

- layout: content
  title: 'Token, Kosten und Qualität getrennt messen'
  bullets:
  - 'Routing: Kosten pro gelöster Aufgabe'
  - 'Caching: Berechnung wiederverwenden'
  - 'Kontext: nur Relevantes mitgeben'
  - 'Specs können Korrekturschleifen sparen'
  - 'Qualität an festen Kriterien prüfen'
  sources:
  - text: 'Eigene Praxiserfahrung, kein kontrollierter Vergleich'
    footnote: true
  - 'Prompt Caching': https://developers.openai.com/api/docs/guides/prompt-caching
  bg_effect:
    path: deck_images/img_19722dab0474.png
  speaker: 'Tobias'
  notes: |
    Etwa 7 min. 4 min Routing, live: dieselbe Aufgabe über zwei SAIA-Modelle,
    qwen3-coder-next für Code, glm-4.7 für agentische Aufgaben, deepseek-v4-flash als
    Budget-Wahl. oh-my-opencode: benannte Agents mit einem Modell je Kategorie. LiteLLM-Gateway:
    ein Endpunkt, viele Modelle.
    2 min Caching und Kontext-Hygiene: Weniger Kontext kann Input-Token sparen. Caching nutzt
    bereits berechnete Kontextteile erneut und kann Latenz und Kosten senken, verkleinert aber
    nicht den logischen Kontext. Modell-Routing verändert vor allem den Preis pro Token und
    kann Qualität sowie die Zahl nötiger Versuche verändern.
    1 min Prinzipien, dann Brücke zum zweiten Hands-On: Eine klare Spec kann Rückfragen und
    Korrekturschleifen sparen; ihr Erstellen und Laden kostet ebenfalls Token.
    Keine pauschale Einsparquote und kein Versprechen gleicher Qualität. Vergleiche brauchen
    dieselben Aufgaben und vorab festgelegte Qualitätskriterien; Input-, Output- und gecachte
    Token, Gesamtkosten, Laufzeit und Fehlversuche getrennt erfassen.
    Glossar: KV-Cache = das Modell merkt sich Kontext-Berechnungen über Schritte; Kompaktion =
    alten Kontext zusammenfassen oder verwerfen. pi-memory und Knowledge Graph persistieren
    Erfahrung außerhalb des Kontexts.

