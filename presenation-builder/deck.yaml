  notes: |
    TOBIAS. Jeder Block des Workshops folgte derselben Pyramide, auch OpenSpec. Jetzt auf das
    eigene Projekt übertragen.
    Given/When/Then für die erste Spec. Delta-Specs für den ersten Change. pi-memory oder ein
    Knowledge Graph statt Prompt-Stücken. Der Loop wird institutionalisiert: Die Spezifikation
    wächst mit dem Betrieb.
    Die Pyramide ist überall: papers.yaml = Spezifikation, Pipeline = Vertrag, CI = Test.

