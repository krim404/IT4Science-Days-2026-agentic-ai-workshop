  - ['10:45', 'Spezifikation und Token', 'Christian, Tobias']
  - ['11:00', 'Hands-On: Mit Spec', 'Christian']
  - ['11:30', 'Outcomes, Q&A, Wrap Up', 'Tobias, Christian']
  notes: |
    TOBIAS. Agenda in einer Minute. Pausen: 10:10 bis 10:20 und 11:25 bis 11:30.
