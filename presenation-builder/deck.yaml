- layout: table
  title: 'Schon das Mindestziel zeigt, dass die Methode sitzt'
  headers: ['Ebene', 'Mindestziel', 'Vollständig']
  rows:
  - ['Spezifikation', 'ein Satz, der widerlegt werden kann', 'Szenario: Ausgangslage, Eingriff, Ergebnis']
  - ['Vertrag', 'eine Aufgabenliste mit drei Punkten', 'Vorschlag, Entwurf, Spezifikation, Aufgaben']
  - ['Tests', 'eine Prüfung, die fehlschlagen könnte', 'läuft automatisch und besteht']
  notes: |
    CHRISTIAN. Bewusst zweistufig. In fünfundzwanzig Minuten erreicht ein Teil des Raums die
    rechte Spalte nicht, und das ist kein Scheitern.
    (1) Mindestziel vor dem Arbeiten ansagen. Das nimmt Druck.
    (2) Die linke Spalte der ersten Zeile ist der eigentliche Lerninhalt: ein Satz, der
        widerlegt werden kann.
    (3) Eine Prüfung, die nicht fehlschlagen kann, prüft nichts, wie ein Experiment ohne
        mögliches Negativergebnis. Beim Herumgehen: Ein Kriterium nennt auch, was es
        ausschließt, etwa "das Feld kommt als nicht angegeben zurück, statt mit einer Vermutung
        gefüllt zu werden". Wer eine Skala von 1 bis 5 vorschlägt, zerlegt sie in
        Ja-Nein-Prüfungen oder nennt die Schwelle: Bei Ja/Nein urteilen zwei Personen in 87
        Prozent der Fälle gleich, bei einer Fünferskala nur in 38 bis 58 Prozent (Rao und
        Callison-Burch, Autorubric, arXiv 2603.00077).
    Schlusssatz: Erledigt ist, was die Prüfung besteht.

