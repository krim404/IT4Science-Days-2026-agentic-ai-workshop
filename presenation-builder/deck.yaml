    Dazwischen der Theorieblock zu Spezifikation und Token.

- layout: section
  number: '1'
  title: 'Grundlagen: worüber wir sprechen'
  bg_effect:
    path: deck_images/img_9c68f94380d4.png
  notes: |
    CHRISTIAN, Block 1, 09:15 bis 09:30. Zwei Folien lang geht es nur um Sprache, damit wir
    nicht aneinander vorbeireden.

- layout: table
  title: 'Bei diesen fünf Begriffen legen wir uns für heute fest'
  headers: ['Begriff', 'Worüber gestritten wird', 'Unsere Festlegung']
  rows:
  - ['Agent', 'von Chatbot bis autonomes System', 'Das Modell bestimmt die nächsten Schritte']
  - ['Reasoning', 'ob das Denken ist', 'mehr Rechenzeit zur Laufzeit']
  - ['Halluzination', 'Begriff umstritten, eher Konfabulation', 'unbelegte Ausgabe, Grund für die Tests']
  - ['Open Source', 'offene Gewichte sind nicht OSI', 'wir meinen offene Gewichte']
  - ['Reproduzierbarkeit', 'gleiche Eingabe, anderes Ergebnis', 'geprüft wird das Ergebnis, nicht der Weg']
  notes: |
    CHRISTIAN. Nicht alle fünf Zeilen gleich lang behandeln, die letzten beiden tragen das
    Publikum. Rahmensatz: Bei diesen Begriffen ist sich die Fachwelt nicht einig. Wir legen uns
    für heute fest. Das ist eine Setzung, kein Stand der Forschung.

    (1) Agent: Trennlinie ist, wer den Ablauf bestimmt. Bestimmt das Modell die nächsten
        Schritte, ist es ein Agent. Eine feste Abfolge ist ein Workflow, auch wenn ein Modell
        darin vorkommt.
    (2) Reasoning: nüchtern halten, mehr Rechenzeit zur Laufzeit, mehr Zwischenschritte. In
        manchen Werkzeugen heißt dasselbe "Thinking". Ob das Denken ist, kostet nur
        Diskussionszeit.
    (3) Halluzination: nicht beschwichtigen. Ein Modell, das das nächste Token vorhersagt, kann
        belegt und plausibel nicht unterscheiden. Daraus folgt: maschinell verifizieren statt
        vertrauen. Für die Literaturrecherche konkret: "Steht nicht im Dokument" ist eine
        richtige Antwort, keine fehlende. Wo sie nicht erlaubt ist, füllt das Modell die Lücke
        mit einem plausiblen Wert.
    (4) Open Source: Frei verfügbare Gewichte sind nicht Open Source im Sinne der OSI.
        Trainingsdaten und Verfahren bleiben meist verschlossen.
    (5) Reproduzierbarkeit: hier Zeit lassen. Die Sorge aussprechen: gleiche Eingabe,
        abweichendes Ergebnis widerspricht wissenschaftlichem Arbeiten. Die Antwort: Der Weg ist
        nicht reproduzierbar, das Ergebnis muss es sein. Beim Chip hat niemand dem Agenten
        geglaubt, die Testsuite hat entschieden.

    Wenn die Zeit knapp wird: (2) und (4) auf je einen Satz. (5) niemals kürzen.

- layout: table
  title: 'Ein agentisches System besteht aus vier Bausteinen'
  headers: ['Baustein', 'Was es ist', 'Was es nicht ist']
  rows:
  - ['Modell', 'sagt das nächste Token voraus', 'kein Wissensspeicher, keine Datenbank']
  - ['Kontext', 'was im Eingabefenster steht', 'kein Gedächtnis, endet mit der Sitzung']
  - ['Werkzeuge', 'Dateien, Shell, Netz, Schnittstellen', 'keine Rechte jenseits des Freigegebenen']
  - ['Harness', 'stellt Kontext, ruft Werkzeuge, speist zurück', 'trifft die Entscheidungen nicht selbst']
  notes: |
    CHRISTIAN. Über Spezifikation und Verifikation lässt sich nicht sprechen, solange offen ist,
    wer hier eigentlich handelt. Der Raum ist gemischt, beide Hälften meinen mit "KI" etwas
    anderes. Wir zerlegen den Begriff einmal.

    Modell: sagt das nächste Token voraus, nichts weiter. Was es nicht im Kontext hat, kann es
    nur rekonstruieren.
    Kontext: Repository, Spezifikation, Verlauf. Kein Gedächtnis. Deshalb gehören Regeln in
    Dateien und nicht in Sitzungen (AGENTS.md im ersten Hands-On).
    Werkzeuge: erst hiermit handelt das System. Wer nichts freigibt, bekommt einen
    Gesprächspartner, keinen Agenten.
    Harness: Kontext zusammenstellen, Werkzeuge aufrufen, Ergebnisse zurückspeisen, Schleife
    beenden. Das Modell entscheidet, was geschehen soll; das Harness sorgt dafür, dass es
    geschehen kann. In der Literatur heißt dieselbe Schicht überwiegend "Scaffolding".

    Alle vier zusammen sind das, was umgangssprachlich "KI" heißt.
    Übergabe an Tobias' Block: Dasselbe Modell, ein anderes Harness, ein anderes Ergebnis.

    Wenn die Zeit knapp wird: Werkzeuge auf zwei Sätze. Kontext und Harness nicht kürzen.

- layout: section
  number: '2'
  title: 'Spezifikation, Vertrag, Tests'
  bg_effect:
    path: deck_images/img_688fddd86552.png
  notes: |
    CHRISTIAN. Abschnittstrenner, etwa zwei Sätze. Ab hier geht es nicht mehr um Werkzeuge,
    sondern um die Arbeitsweise. Dieselbe Struktur taucht heute noch dreimal auf: im
    Research-Repository, in OpenSpec und in der eigenen Übung.
    In den Werkzeugen heißen die Ebenen englisch Spec, Contract und Test.

- layout: content_image
  title: 'Fragen oder Beauftragen'
  bullets:
  - 'Fragen: „Fassen Sie diese Papers zusammen.“'
  - 'Beauftragen: „Extrahieren Sie diese fünf Felder aus jedem Paper.“'
  image:
    path: deck_diagrams/dia_brief.png
    purpose: 'Zeigt, dass nur das Beauftragen eine Prüfung mit Abbruchbedingung hat, die bei einem Fehlschlag zurück in die Umsetzung führt.'
  notes: |
    CHRISTIAN. Das konkrete Beispiel vor der Pyramide. Die beiden Bahnen nacheinander
    durchgehen, nicht gegeneinander.

    (1) Linke Bahn: "Fassen Sie diese Papers zusammen." Es kommt ein Text, er liest sich gut,
        Sie entscheiden nach Eindruck. Dann ist die Bahn zu Ende. Zusammenfassen ist dabei das
        schwerere Problem: Die Zusammenfassung entscheidet selbst, was wichtig ist, und niemand
        kann nachprüfen, was weggefallen ist.
    (2) Rechte Bahn: "Extrahieren Sie diese fünf Felder aus jedem Paper." Fünf benannte Felder
        kann man prüfen. Der Unterschied ist nicht die Formulierung, sondern das Kriterium.
    (3) Der Rückpfeil ist der Kern: Nur die rechte Bahn kann scheitern, und genau deshalb kann
        sie auch fertig werden. Merksatz: Wer nicht sagen kann, woran es scheitern würde, hat
        nicht beauftragt, sondern gehofft.
    (4) Bezug zum Raum: Die Literaturrecherche aus dem Blitzlicht ist genau dieser Fall.

- layout: content_image
  title: 'Die Spezifikation regiert, der Test entscheidet'
  bullets:
  - 'Jede Ebene ist eine Datei, kein Gespräch'
  - 'Der Vertrag ist eine Spezifikation für eine Änderung'
  - 'Der Vertrag nennt das Kriterium, der Test wendet es an'
  - 'Was die Tests zeigen, ändert die Spezifikation'
  image:
    path: deck_diagrams/dia_levels.png
    purpose: 'Zeigt die drei Ebenen in der Reihenfolge ihrer Autorität und den Rückweg, auf dem die Tests die Spezifikation wachsen lassen.'
  notes: |
    CHRISTIAN. Die Pyramide als roter Faden des Vormittags. Spezifikation oben als Quelle der
    Wahrheit, Vertrag in der Mitte als Auftrag an den Agenten, Tests unten als objektive
    Entscheidung. Wir kommen auf dieses Bild immer wieder zurück.
    Rückverweis auf den Chip: Genau diese drei Ebenen lagen dort vor.
    Der gestrichelte Pfeil ist der eigentliche Punkt: Die Spezifikation ist kein Dokument, das
    am Anfang geschrieben und dann abgelegt wird.

- layout: table
  title: 'Jede der drei Ebenen legt etwas anderes fest'
  headers: ['Ebene', 'Legt fest', 'Im Repository']
  rows:
  - ['Spezifikation', 'was gelten soll, prüfbar formuliert', 'specs/, AGENTS.md']
  - ['Vertrag', 'was sich jetzt ändert, und woran man es misst', 'ein Change mit Vorschlag und Aufgaben']
  - ['Tests', 'ob die Anforderung erfüllt ist', 'Testsuite, Validierung, CI']
  notes: |
    CHRISTIAN. Diese Folie erklärt das Bild Ebene für Ebene.

    (1) Spezifikation: nicht "das Gerät soll sicher sein", sondern eine Anforderung, deren
        Erfüllung sich prüfen lässt. Für dieses Publikum: eine Hypothese, die so formuliert ist,
        dass ein Experiment sie widerlegen könnte. Kriterien vor der Arbeit: Wer sie hinterher
        formuliert, formuliert sie so, dass das Ergebnis passt. Genau deshalb gibt es
        Präregistrierung.
    (2) Vertrag: Der Agent bekommt nicht die gesamte Spezifikation, sondern die Differenz: Das
        ist der Stand, das soll sich ändern, daran wird es gemessen. Analogie: das
        Versuchsprotokoll für einen Durchlauf. Der Vertrag ist selbst eine Spezifikation, nur für
        eine Änderung. Er nennt das Kriterium, der Test wendet es an.
    (3) Tests: Die Ebene, die entscheidet. Bestanden oder nicht bestanden. Hier löst sich die
        Sorge um Reproduzierbarkeit auf: Der Weg ist nicht reproduzierbar, das Ergebnis wird es.

    Glossar für Rückfragen: SHALL, MUST, SHOULD sind die üblichen Signalwörter. "Gegeben, wenn,
    dann" ist die Schablone für Szenarien: Ausgangslage, Eingriff, erwartetes Ergebnis.

