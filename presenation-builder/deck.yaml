title: 'Agentic AI in der Praxis'
author: 'Christian Uhl · Tobias Weiß'
date: '30.09.2026'
lang: de

background: doodle
slides:

- layout: title
  title: 'Agentic AI in der Praxis'
  subtitle: 'Vom Spec zum produktiven Workflow, mit Übungen am eigenen Rechner'
  bg_effect:
    path: deck_images/img_15d7d72fd0e7.png
  notes: |
    Begrüßung (~1 min). Kurz vorstellen: Wer wir sind, worum es geht.
    IT4Science Days 2026, 09:00 bis 12:00.
    Ziel: Die Teilnehmenden verlassen den Raum mit einem eigenen Research-Repo, das per CI
    validiert wird, und haben einen OpenSpec-Change selbst angewendet.

- layout: comparison
  title: 'Zwei Beispiele aus unserer eigenen Arbeit'
  columns:
  - heading: 'Christian Uhl · ZAD, Uni Gießen'
    bullets:
    - 'Unbekannter Chip ohne Firmware'
    - 'Ein einzelner Fehler hätte ihn zerstört'
    - 'Sorgfältig war zu langsam, schnell zu riskant'
    - 'Nach 24 Stunden: FIDO2-Firmware, spec- und testgetrieben'
  - heading: 'Tobias Weiß · DevOps, Uni Marburg'
    bullets:
    - 'openDesk Edu: Dienste für Forschung, Lehre, Verwaltung'
    - 'Wissens-Pipelines und IT-Betrieb agentisch'
    - 'Open-Source-Software mit Open-Source-Werkzeugen'
  notes: |
    CHRISTIAN führt durch die Vorstellung (~3 min); Tobias trägt sein Beispiel selbst vor
    (~1 min). Eigenes Beispiel 60 bis 90 s. Badge mitbringen, hochhalten, durch den Raum
    geben: Das Objekt trägt die Folie, nicht der Text.

    Die Prämisse als Versuchsanordnung darstellen, nicht als Erfolgsgeschichte: Die
    Ausgangsfrage lautete, wie weit man unter denkbar ungünstigen Bedingungen kommt. Der
    Ausgang war offen.

    Erzählbogen in fünf Schritten:
    (1) Die Hardware war vorhanden, jedoch ohne Firmware und damit funktionslos. Der Chip war
        unbekannt, seine Dokumentation unzureichend.
    (2) Die Konferenz lief bereits; ein Zeitfenster für reguläre Hardwareentwicklung gab es nicht.
    (3) Ein einzelner Fehler am Secure Element hätte das Gerät dauerhaft unbrauchbar gemacht.
    (4) Der Zielkonflikt: Sorgfältiges Vorgehen war zeitlich ausgeschlossen, unsorgfältiges
        wegen des Risikos.
    (5) Aufgelöst durch spezifikations- und testgetriebene Entwicklung. Nach 24 Stunden lag eine
        vollständige Custom-Firmware vor, als FIDO2-Sicherheitsschlüssel einsetzbar.

    Kernsatz: "Das Tempo war nur deshalb vertretbar, weil die Testsuite jeden Fehler abfängt,
    bevor er das Gerät erreicht." Die Tests laufen auf dem Entwicklungsrechner, ein Fehlversuch
    kostet dort nichts.

    Übertragung, nicht auslassen: Das Äquivalent in der Forschung ist nicht der zerstörte Chip,
    sondern verbrauchte Messzeit oder eine bereits publizierte Auswertung.

    Ton: Die Methode ist der Held, nicht der Sprecher.

- layout: content
  title: 'Ihre Reihe: Blitzlicht in dreißig Sekunden pro Person'
  bullets:
  - 'Name, Fachrichtung, ein Thema für eine Literaturrecherche'
  - 'Selbsteinschätzung KI: eher Anfang oder eher fortgeschritten?'
  - 'Wir sammeln die Wünsche am Whiteboard'
  - 'Am Ende prüfen wir sie gegen die Outcomes'
  notes: |
    CHRISTIAN moderiert (~3 min). Die gesammelten Wünsche sichtbar notieren, das Wrap-Up greift
    sie auf. Zeit hart timen.
    Bei großen Runden: 5 bis 6 Stichproben aus dem Raum, Rest per Karte oder Zettel.
    Selbsteinschätzung mit Handzeichen oder kurz mündlich, kein Werturteil. Mit der Abstufung
    wird das Herumgehen gezielt: Fortgeschrittene bekommen Vertiefung, Anfänger Starthilfe.

- layout: content
  title: 'Der Vormittag liefert ein Werkzeug, keinen fertigen Bot'
  bullets:
  - 'Ein Research-Repo mit laufender Pipeline'
  - 'Einen Spec-Change, live umgesetzt'
  - 'Werkzeuge für Modelle und Harnesses statt Trendlisten'
  - 'Nicht dabei: der voll-autonome Assistent'
  notes: |
    TOBIAS (~90 s). Erwartungsmanagement aus der JLU-Erfahrung (09/2026): Viele erwarten
    fertige Bots à la Claude Cowork. Ernst nehmen, nicht abwerten.
    Kernsatz: Wir bauen keine voll-autonomen Assistenten, sondern führen und korrigieren die
    Agenten.
    Dialogmuster für "Ich will nur einen Bot": den Kernsatz sagen, dann "Genau das ist heute."
    Bei Unruhe die Blitzlicht-Wünsche aufgreifen: Die meisten waren Agent-Aufgaben, keine
    Bot-Wünsche.

