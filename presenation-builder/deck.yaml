  - ['openspec/changes/', 'die eine anstehende Änderung', 'Vertrag, genau das bekommt der Agent']
  - ['openspec/archive/', 'alle abgeschlossenen Änderungen', 'Begründung, warum so entschieden']
  notes: |
    CHRISTIAN. Die Folie wiederholt nicht die Pyramide, sondern zeigt, wo die Ebenen als Dateien
    liegen. Der Zugewinn ist die dritte Zeile.
    (1) Spezifikation: gilt dauerhaft, wird nicht pro Sitzung neu verhandelt.
    (2) Vertrag: nur die Differenz. Nicht "baue mir ein Analysewerkzeug", sondern "ergänze diese
        eine Auswertung, gemessen an diesem Kriterium".
    (3) Archiv: für Forschende der interessanteste Teil. In einem halben Jahr ist "warum haben
        wir das so gerechnet" noch beantwortbar. Methodendokumentation, die nebenbei entsteht.
    Überleitung: Der Agent braucht nicht das ganze Projekt, der Vertrag genügt. Das ist zugleich
    die wirksamste Einsparung an Kontext.

- layout: table
  title: 'Spec-Kit baut Neues, OpenSpec ändert Bestehendes'
  headers: ['', 'Spec-Kit', 'OpenSpec']
  rows:
  - ['Grundidee', 'was gebaut werden soll', 'wie sich Bestehendes ändert']
  - ['Typischer Fall', 'Neubau, neue Funktionen', 'laufende Weiterentwicklung']
  - ['Quelle der Wahrheit', 'eine Spezifikation je Vorhaben', 'dauerhafte Spezifikation plus Änderungen']
  - ['Ablauf', 'specify, clarify, plan, tasks', 'propose, apply, sync, archive']
  - ['Aufwand', 'höher, mehr Prozessführung', 'niedriger']
  sources:
  - 'GitHub Spec Kit': https://github.com/github/spec-kit
  - 'Fission AI OpenSpec': https://github.com/Fission-AI/OpenSpec
  notes: |
    CHRISTIAN. Beantwortet vorab, warum ausgerechnet OpenSpec. Kurz halten, es geht um die
    Denkweise.
    (1) Spec-Kit denkt in Vorhaben, OpenSpec in Änderungen.
    (2) Spec-Kit: pro Funktion ein Satz Dokumente. Nach fünfzig Vorhaben liegen fünfzig
        Momentaufnahmen vor, und welche den heutigen Stand beschreibt, ist schwer zu sagen.
    (3) OpenSpec: eine dauerhafte Spezifikation, daneben Änderungen als ADDED, MODIFIED oder
        REMOVED. Nach dem Abschluss wandert die Änderung in die Hauptspezifikation.
    (4) Analogie: das Studienprotokoll je Teilstudie gegen das fortgeschriebene Handbuch mit
        Änderungsnachweis.
    Faustregel: Neues Vorhaben Spec-Kit, bestehendes System, das wächst, OpenSpec. Heute
    bearbeiten wir ein bestehendes Repository, deshalb OpenSpec. Das ist der Grund, kein
    Werturteil.

