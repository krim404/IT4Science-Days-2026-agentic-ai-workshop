<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="540" height="460"
     role="img" aria-labelledby="pvc-title pvc-desc">
  <title id="pvc-title">Fragen und Beauftragen</title>
  <desc id="pvc-desc">Zwei parallele Bahnen. Fragen verlaeuft ueber Prompt, Antwort und das eigene Urteil
  und endet ohne Abbruchbedingung. Beauftragen verlaeuft ueber Vertrag, Umsetzung und Pruefung: Die
  Pruefung ist entweder bestanden, dann ist die Aufgabe erledigt, oder nicht bestanden, dann geht die
  Arbeit zurueck in die Umsetzung.</desc>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8a8a8a"/>
    </marker>
    <marker id="ar-fail" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#1a1a1a"/>

  <!-- arrows first, so boxes paint over the line ends -->
  <line x1="120" y1="112" x2="120" y2="144" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="120" y1="216" x2="120" y2="248" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="120" y1="320" x2="120" y2="358" stroke="#8a8a8a" stroke-width="1.6"
        stroke-dasharray="4 6" stroke-opacity="0.55"/>

  <line x1="348" y1="112" x2="348" y2="144" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="348" y1="216" x2="348" y2="248" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="348" y1="320" x2="348" y2="360" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M 440 288 L 464 288 Q 472 288 472 280 L 472 192 Q 472 184 464 184 L 440 184"
        fill="none" stroke="#ff8a8a" stroke-width="1.6" marker-end="url(#ar-fail)"/>

  <text x="358" y="346" fill="#7ee2a8" font-size="18"
        font-family="'Segoe UI', system-ui, sans-serif">bestanden</text>
  <rect x="426" y="212" width="92" height="44" fill="#1a1a1a"/>
  <text x="472" y="230" fill="#ff8a8a" font-size="18"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">nicht</text>
  <text x="472" y="250" fill="#ff8a8a" font-size="18"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">bestanden</text>

  <text x="120" y="34" fill="#c8c8c8" font-size="16" letter-spacing="1.5"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">FRAGEN</text>
  <text x="348" y="34" fill="#c8c8c8" font-size="16" letter-spacing="1.5"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">BEAUFTRAGEN</text>

  <!-- asking lane -->
  <rect x="24" y="48" width="192" height="64" rx="6" fill="#2a2a2a" stroke="#8a8a8a"/>
  <text x="120" y="90" fill="#ffffff" font-size="26" font-weight="600"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Prompt</text>

  <rect x="24" y="152" width="192" height="64" rx="6" fill="#2a2a2a" stroke="#8a8a8a"/>
  <text x="120" y="193" fill="#ffffff" font-size="26" font-weight="600"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Antwort</text>

  <rect x="24" y="256" width="192" height="64" rx="6" fill="#2a2a2a" stroke="#8a8a8a"/>
  <text x="120" y="286" fill="#ffffff" font-size="26" font-weight="600"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Sie urteilen</text>
  <text x="120" y="309" fill="#9a9a9a" font-size="18"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">nach Eindruck</text>

  <text x="120" y="384" fill="#9a9a9a" font-size="18"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">keine Abbruchbedingung</text>

  <!-- commissioning lane -->
  <rect x="256" y="48" width="184" height="64" rx="6" fill="#3a2a10" stroke="#ffd88a"/>
  <text x="348" y="90" fill="#ffd88a" font-size="26" font-weight="600"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Vertrag</text>

  <rect x="256" y="152" width="184" height="64" rx="6" fill="#2a2a2a" stroke="#8a8a8a"/>
  <text x="348" y="193" fill="#ffffff" font-size="26" font-weight="600"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Umsetzung</text>

  <rect x="256" y="256" width="184" height="64" rx="6" fill="#14432a" stroke="#7ee2a8"/>
  <text x="348" y="286" fill="#7ee2a8" font-size="26" font-weight="600"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Prüfung</text>
  <text x="348" y="309" fill="#b8e8cc" font-size="18"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">gegen das Kriterium</text>

  <rect x="256" y="368" width="184" height="64" rx="6" fill="#2a2a2a" stroke="#8a8a8a"/>
  <text x="348" y="409" fill="#ffffff" font-size="26" font-weight="600"
        font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Erledigt</text>
</svg>
